services:
  - type: web
    name: vegetation-monitor
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    buildCommand: |
      docker build -t vegetation-monitor .
      docker run --rm vegetation-monitor python -m src.train
      docker run --rm vegetation-monitor python -m src.precompute
    startCommand: uvicorn webapp.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONPATH
        value: "/app"